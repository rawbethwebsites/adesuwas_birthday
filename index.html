<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>For My Love</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;500;600&family=Parisienne&family=Playfair+Display:wght@400;600;700&family=Quicksand:wght@400;500&display=swap"
      rel="stylesheet"
    />
  <link rel="stylesheet" href="styles.css" />
  <!-- Calendar component styles (embedded for CDN/demo integration) -->
  <style>
  /* Basic mobile-friendly styles for the Calendar component */
  .container {
    max-width: 980px;
    margin: 0 auto;
    padding: 16px;
    font-family: Arial, Helvetica, sans-serif;
    color: #3a2140;
  }

  .header { text-align: center; margin-bottom: 12px; }
  .header h1 { margin: 0; font-size: 1.6rem; letter-spacing: -0.5px; }
  .sub { margin: 6px 0 0 0; color: #6c4b66; font-size: 0.95rem; }

  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  @media (max-width: 640px) { .grid { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 420px) { .grid { grid-template-columns: repeat(2, 1fr); } }

  .card { background: linear-gradient(180deg, #fff, #fffaf8); border-radius: 12px; border: 1px solid rgba(58,33,64,0.06); padding: 10px; cursor: pointer; transition: transform 160ms ease, box-shadow 160ms ease; display: flex; align-items: center; justify-content: center; min-height: 72px; }
  .card:hover { transform: translateY(-4px); box-shadow: 0 8px 20px rgba(58,33,64,0.07); }
  .today { box-shadow: 0 8px 24px rgba(249,164,200,0.12); border: 1px solid rgba(249,164,200,0.28); }
  .cardInner { text-align: center; }
  .day { font-size: 1.3rem; font-weight: 700; }
  .label { font-size: 0.75rem; color: #7a5a73; }

  /* Modal */
  .modalOverlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(10, 6, 10, 0.45); z-index: 9999; padding: 20px; }
  .modal { width: min(560px, 96%); background: white; border-radius: 12px; box-shadow: 0 24px 60px rgba(10,6,10,0.35); position: relative; overflow: hidden; }
  .closeBtn { position: absolute; right: 10px; top: 6px; background: transparent; border: none; font-size: 22px; cursor: pointer; color: #7a5a73; }
  .modalContent { padding: 20px; text-align: center; }
  .modalTitle { margin: 8px 0 16px 0; font-size: 1.25rem; color: #3a2140; }

  .envelopeWrap { display:flex; align-items:center; justify-content:center; padding: 24px 8px 32px 8px; }
  .envelope { display: inline-flex; flex-direction: column; align-items: center; gap: 8px; padding: 18px 22px; background: linear-gradient(180deg,#fff6f8,#fff1f5); border-radius: 12px; border: 1px solid rgba(58,33,64,0.05); min-width: 160px; min-height: 110px; cursor: pointer; user-select: none; transition: transform 200ms cubic-bezier(.2,.9,.3,1); }
  .envelope:active { transform: translateY(4px) scale(0.99); }
  .envelopeEmoji { font-size: 42px; display:block; animation: float 2.4s ease-in-out infinite; }
  @keyframes float { 0% { transform: translateY(0) } 50% { transform: translateY(-8px) } 100% { transform: translateY(0) } }
  .envelopeHint { font-size: 0.95rem; color: #6c4b66; }

  .letterBox { padding: 14px 18px 22px 18px; }
  .letterText { white-space: pre-wrap; text-align: left; color: #3a2140; font-size: 0.95rem; line-height: 1.6; background: #fffaf6; border-radius: 8px; padding: 12px; border: 1px solid rgba(58,33,64,0.03); min-height: 120px; }
  .letterActions { display:flex; justify-content:center; margin-top: 12px; }
  .closePrimary { background: linear-gradient(180deg,#ffdfe9,#ffcee4); border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; color: #3a2140; font-weight: 600; }
  </style>
  </head>
  <body>
    <div class="background-glow"></div>
    <main class="page">
      <!-- Calendar page only: mount React calendar here -->
      <section style="width:100%;max-width:980px;margin:32px auto;padding:16px;">
        <h1 style="margin:0 0 8px 0;font-family: 'Playfair Display', serif;">November Calendar</h1>
        <p style="margin:0 0 18px 0;color:#6c4b66;">Tap a date to open its letter</p>
        <section id="calendar-root" class="react-calendar-root" aria-label="Calendar component"></section>
      </section>
    </main>

    <!-- React (CDN) + Babel for demo integration -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    function Calendar() {
      // Fixed range: November 12 - 30, 2025
      const year = 2025;
      const novemberMonth = 10; // November (0-based)
      const startDay = 12;

      const days = useMemo(() => {
        const list = [];
        for (let d = startDay; d <= 30; d++) list.push(new Date(year, novemberMonth, d));
        return list;
      }, []);

  // we will fetch per-day letter pages (day12.html ... day30.html) when envelope is opened
  const [modalOpen, setModalOpen] = useState(false);
  const [selectedDate, setSelectedDate] = useState(null);
  const [letterRevealed, setLetterRevealed] = useState(false);
  const [letterHtml, setLetterHtml] = useState("");
  const [loadingLetter, setLoadingLetter] = useState(false);
  const [messagesMap, setMessagesMap] = useState(null);

      useEffect(() => { setLetterRevealed(false); setLetterHtml(""); setLoadingLetter(false); }, [selectedDate, modalOpen]);
      useEffect(() => { function onKey(e){ if (e.key === 'Escape') setModalOpen(false); } window.addEventListener('keydown', onKey); return () => window.removeEventListener('keydown', onKey); }, []);

      function openForDate(dateObj){ setSelectedDate(dateObj); setModalOpen(true); }
      function closeModal(){ setModalOpen(false); setSelectedDate(null); setLetterRevealed(false); setLetterHtml(""); setLoadingLetter(false); }

      async function handleEnvelopeClick(){
        if (!selectedDate) return;
        const day = selectedDate.getDate();

        // If we have a central messages.json loaded, use it
        if (messagesMap && messagesMap[day]) {
          setLetterHtml(messagesMap[day]);
          setLetterRevealed(true);
          return;
        }

        const url = `./day${day}.html`;
        setLoadingLetter(true);
        try {
          const res = await fetch(url, {cache: 'no-store'});
          if (!res.ok) throw new Error('Failed to load');
          const text = await res.text();
          // extract #letter-content innerHTML
          const parser = new DOMParser();
          const doc = parser.parseFromString(text, 'text/html');
          const content = doc.getElementById('letter-content');
          setLetterHtml(content ? content.innerHTML : text);
          setLetterRevealed(true);
        } catch (err) {
          setLetterHtml('<p>Sorry, could not load the letter.</p>');
          setLetterRevealed(true);
        } finally { setLoadingLetter(false); }
      }

      // attempt to load centralized messages.json once
      useEffect(()=>{
        let mounted = true;
        (async ()=>{
          try{
            const r = await fetch('./messages.json',{cache:'no-store'});
            if(!r.ok) return;
            const j = await r.json();
            if(mounted) setMessagesMap(j);
          }catch(e){}
        })();
        return ()=>{ mounted=false; };
      },[]);

      return (
        <div className="container">
          <header className="header"><h1>November</h1><p className="sub">Tap a date to open its letter</p></header>
          <div className="grid">
            {days.map((dt)=>{
              const day = dt.getDate();
              return (
                <button key={day} className={`card`} onClick={()=>openForDate(dt)} aria-label={`Open letter for November ${day}`}>
                  <div className="cardInner"><div className="day">{day}</div><div className="label">Nov</div></div>
                </button>
              );
            })}
          </div>

          {modalOpen && (
            <div className="modalOverlay" role="dialog" aria-modal="true">
              <div className="modal">
                <button className="closeBtn" onClick={closeModal} aria-label="Close">×</button>
                <div className="modalContent">
                  <h2 className="modalTitle">{selectedDate ? `November ${selectedDate.getDate()}` : 'Letter'}</h2>
                  {!letterRevealed ? (
                    <div className="envelopeWrap">
                      <div className="envelope" role="button" tabIndex={0} onClick={handleEnvelopeClick} onKeyDown={(e)=>e.key==='Enter'&&handleEnvelopeClick()} aria-label="Open and read your letter">
                        <span className="envelopeEmoji" aria-hidden>✉️</span>
                        <div className="envelopeHint">{loadingLetter ? 'Loading...' : 'Open and read your letter'}</div>
                      </div>
                    </div>
                  ) : (
                    <div className="letterBox">
                      <div className="letterText" dangerouslySetInnerHTML={{__html: letterHtml || '<p>No letter found.</p>'}} />
                      <div className="letterActions"><button className="closePrimary" onClick={closeModal}>Close</button></div>
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    document.addEventListener('DOMContentLoaded', function(){
      const root = document.getElementById('calendar-root');
      if (root) ReactDOM.createRoot(root).render(<Calendar />);
    });

    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/TextPlugin.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
