  /* Improved, friendlier UI for the calendar + envelope modal */
  .container {
    max-width: 960px;
    margin: 10px auto;
    padding: 18px;
    font-family: "Quicksand", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;

  .header { text-align: left; margin: 6px 0 18px 8px; }
  .header h1 { margin: 0; font-family: 'Playfair Display', serif; font-size: 2rem; font-weight: 700; color: #4a2a47; }
  .sub { margin: 6px 0 0 8px; color: #7a5a73; font-size: 0.98rem; }

  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; align-items: stretch; }
  @media (max-width: 820px) { .grid { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 520px) { .grid { grid-template-columns: repeat(2, 1fr); } }

  .card { background: linear-gradient(180deg, #ffffff, #fff9fb); border-radius: 14px; border: 1px solid rgba(74,42,71,0.06); padding: 12px; cursor: pointer; transition: transform 200ms cubic-bezier(.2,.9,.3,1), box-shadow 200ms ease; display: flex; align-items: center; justify-content: center; min-height: 84px; box-shadow: 0 6px 20px rgba(58,33,64,0.04); text-decoration: none; color: inherit; }
  .card:hover { transform: translateY(-6px); box-shadow: 0 18px 40px rgba(58,33,64,0.08); }
  .cardInner { text-align: center; }
  .day { font-size: 1.4rem; font-weight: 800; color: #3a2140; }
  .label { font-size: 0.75rem; color: #9a7b92; margin-top: 4px; }

  /* Modal overlay and card modal */
  .modalOverlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: linear-gradient(180deg, rgba(10,6,10,0.32), rgba(10,6,10,0.5)); z-index: 9999; padding: 24px; backdrop-filter: blur(4px); }
  .modal { width: min(640px, 98%); background: linear-gradient(180deg,#fff,#fffaf6); border-radius: 14px; box-shadow: 0 30px 80px rgba(10,6,10,0.32); position: relative; overflow: visible; }
  .closeBtn { position: absolute; right: 12px; top: 10px; background: transparent; border: none; font-size: 24px; cursor: pointer; color: #7a5a73; }
  .modalContent { padding: 22px; text-align: center; }
  .modalTitle { margin: 6px 0 18px 0; font-size: 1.3rem; color: #3a2140; font-weight: 700; }

  /* Envelope visual */
  .envelopeWrap { display:flex; align-items:center; justify-content:center; padding: 12px 8px 28px 8px; }
  .envelope { position: relative; width: 320px; max-width: 86%; min-height: 160px; background: linear-gradient(180deg,#fff7fb,#fff2f6); border-radius: 12px; border: 1px solid rgba(74,42,71,0.06); box-shadow: 0 12px 30px rgba(74,42,71,0.06); cursor: pointer; transition: transform 260ms cubic-bezier(.2,.9,.3,1); display:flex; align-items:center; justify-content:center; }
  /* flap element so GSAP can animate it */
  .envelope .flap { position: absolute; left: 0; right: 0; top: 0; height: 54%; background: linear-gradient(180deg, rgba(255,255,255,0.92), rgba(255,230,240,0.9)); clip-path: polygon(0 0, 50% 78%, 100% 0); border-top-left-radius: 12px; border-top-right-radius: 12px; transform-origin: 50% 0; pointer-events: none; }
  /* seal element */
  .envelope .seal { position: absolute; left: 50%; top: 44%; transform: translate(-50%,-50%); background: linear-gradient(135deg,#ffd6e6,#ffb8d0); color:#6a334a; width:48px; height:48px; display:flex; align-items:center; justify-content:center; border-radius:50%; box-shadow: inset 0 1px 6px rgba(255,255,255,0.6), 0 8px 18px rgba(106,51,74,0.12); font-weight:700; pointer-events: none; }

  .envelope .envelopeEmoji { font-size: 46px; display:block; opacity:0.95; transform: translateY(0); transition: transform 260ms ease, opacity 200ms ease; }
  .envelopeHint { margin-top: 8px; color: #7a5a73; font-size: 0.95rem; }

  .letterBox { padding: 14px 18px 18px 18px; width: calc(100% - 36px); box-sizing: border-box; position: absolute; left: 50%; transform: translateX(-50%) translateY(18px); bottom: -8px; opacity: 0; pointer-events: none; transition: transform 360ms cubic-bezier(.2,.9,.3,1), opacity 260ms ease; background: linear-gradient(180deg,#fffdfb,#fff6f1); border-radius: 10px; border: 1px solid rgba(74,42,71,0.04); box-shadow: 0 14px 40px rgba(10,6,10,0.06); }
  .letterText { white-space: pre-wrap; text-align: left; color: #3a2140; font-size: 0.98rem; line-height: 1.6; }
  .letterActions { display:flex; justify-content:center; margin-top: 12px; }

  /* when open */
  .envelope.open { transform: translateY(-8px) scale(1.01); }
  .envelope.open .flap { transform: translateY(-8px) rotateX(16deg); transform-origin: 50% 0; }
  .envelope.open .letterBox { transform: translateX(-50%) translateY(-12px); opacity: 1; pointer-events: auto; }
  .envelope.open .envelopeEmoji { transform: translateY(-8px) scale(0.9); opacity: 0.9; }
  </style>

    <!-- (Removed duplicate vanilla handler — modal creation now handled by the unified fallback below which uses embedded messages when offline and fetch when online) -->

    <!-- React demo removed — page now uses lightweight GSAP + vanilla JS for modal/envelope behavior -->

    <!-- Vanilla fallback: open day pages inside the envelope modal when static links are clicked -->
    <script>
    (function(){
      let messagesCache = null;

      async function loadMessages(){
        if (messagesCache) return messagesCache;
        try{
          const r = await fetch('./messages.json', {cache: 'no-store'});
          if (!r.ok) return null;
          messagesCache = await r.json();
          return messagesCache;
        }catch(e){ return null; }
      }

      async function fetchDayHtml(day){
        try{
          const r = await fetch(`./day${day}.html`, {cache: 'no-store'});
          if (!r.ok) throw new Error('not found');
          const text = await r.text();
          const parser = new DOMParser();
          const doc = parser.parseFromString(text, 'text/html');
          const content = doc.getElementById('letter-content');
          return content ? content.innerHTML : text;
        }catch(e){ return `<p>Sorry, could not load the letter for Nov ${day}.</p>`; }
      }

      function createModal(day){
        const overlay = document.createElement('div');
        overlay.className = 'modalOverlay';
        overlay.innerHTML = `
          <div class="modal" role="dialog" aria-modal="true">
            <button class="closeBtn" aria-label="Close">×</button>
            <div class="modalContent">
              <h2 class="modalTitle">November ${day}</h2>
              <div class="envelopeWrap">
                      <div class="envelope" role="button" tabindex="0">
                        <div class="flap" aria-hidden></div>
                        <div class="seal" aria-hidden>❤</div>
                        <span class="envelopeEmoji" aria-hidden>✉️</span>
                        <div class="envelopeHint">Open and read your letter</div>
                        <div class="letterBox" style="display:block;">
                          <div class="letterText">Loading…</div>
                          <div class="letterActions"><button class="closePrimary">Close</button></div>
                        </div>
                      </div>
                    </div>
            </div>
          </div>
        `;

        // close handlers
        overlay.querySelector('.closeBtn').addEventListener('click', ()=> overlay.remove());
        overlay.querySelector('.closePrimary').addEventListener('click', ()=> overlay.remove());
        overlay.addEventListener('click', (e)=>{ if (e.target === overlay) overlay.remove(); });
        document.addEventListener('keydown', function esc(e){ if (e.key === 'Escape'){ overlay.remove(); document.removeEventListener('keydown', esc); } });

        const envelope = overlay.querySelector('.envelope');
        const hint = overlay.querySelector('.envelopeHint');
        const letterText = overlay.querySelector('.letterText');

        let loaded = false;
        // When envelope clicked, reveal and load content (if needed)
        envelope.addEventListener('click', async function(){
          if (!loaded){
            hint.textContent = 'Loading...';
            const msgs = await loadMessages();
            if (msgs && msgs[day]){
              letterText.innerHTML = msgs[day];
            } else {
              letterText.innerHTML = await fetchDayHtml(day);
            }
            loaded = true;
            hint.textContent = 'Tap to close';
            envelope.classList.add('open');
          } else {
            // toggle close
            envelope.classList.toggle('open');
            hint.textContent = envelope.classList.contains('open') ? 'Tap to close' : 'Open and read your letter';
          }
        });

        return overlay;
      }

      document.addEventListener('DOMContentLoaded', function(){
        const root = document.getElementById('calendar-root');
        if (!root) return;

        // Delegate clicks on static <a class="card"> links inside the fallback grid
        root.addEventListener('click', function(e){
          const a = e.target.closest('a.card');
          if (!a) return;
          // If React replaced the content, these anchors won't exist; if they do, intercept
          e.preventDefault();
          const href = a.getAttribute('href') || '';
          const m = href.match(/day(\d+)\.html$/);
          if (!m) return window.location.href = href;
          const day = m[1];
          const modal = createModal(day);
          document.body.appendChild(modal);
        });
      });
    })();
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/TextPlugin.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script>
    // Initialize GSAP behavior for envelopes and modal interactions
    (function(){
      if (!window.gsap) return;
      // helper to attach animations to an envelope element inside an overlay
      function attachAnimation(envelope){
        if (!envelope) return;
        if (envelope._gsapAttached) return;
        envelope._gsapAttached = true;
        const flap = envelope.querySelector('.flap');
        const letterBox = envelope.querySelector('.letterBox');
        const seal = envelope.querySelector('.seal');
        let tl = null;
        function buildTimeline(){
          // register TextPlugin if available (script.js registers it too, but double-safe here)
          try{ if (window.TextPlugin && window.gsap && typeof window.gsap.registerPlugin === 'function') window.gsap.registerPlugin(window.TextPlugin); }catch(e){}
          tl = gsap.timeline({paused:true});
          tl.to(envelope, {y:-10, scale:1.01, duration:0.28, ease: 'power1.out'}, 0);
          if (flap) tl.to(flap, {rotationX:-140, transformOrigin:'50% 0%', duration:0.5, ease:'back.out(0.6)'}, 0.05);
          if (letterBox) tl.to(letterBox, {y:-18, opacity:1, pointerEvents:'auto', duration:0.36, ease:'power1.out'}, 0.12);
          // Typing (handwriting) reveal per paragraph using TextPlugin if available
          const paras = Array.from(envelope.querySelectorAll('.letterText p'));
          if (paras && paras.length){
            let startPos = 0.25;
            paras.forEach((p)=>{
              const full = p.textContent.trim();
              // clear visible text before typing
              try{ p.textContent = ''; }catch(e){}
              const dur = Math.max(0.6, Math.min(8, (full.length || 20) * 0.04));
              if (gsap && gsap.core && gsap.core.globals && window.TextPlugin){
                tl.to(p, {text: full, duration: dur, ease: 'none'}, startPos);
              } else {
                // fallback: simple fade-in
                tl.fromTo(p, {y:10, opacity:0}, {y:0, opacity:1, duration: Math.min(0.6, dur)}, startPos);
              }
              startPos += dur + 0.08;
            });
          }
        }

        envelope.addEventListener('click', async function(ev){
          // if content not loaded, wait for it (some flows load on first click)
          if (!letterBox) return;
          // build timeline lazily
          if (!tl) buildTimeline();
          const isOpen = envelope.classList.contains('open');
          if (!isOpen){
            envelope.classList.add('open');
            tl.play();
          } else {
            // reverse
            tl.reverse().then(()=>{
              envelope.classList.remove('open');
            });
          }
        });
      }

      // Observe the DOM for overlays (created by vanilla fallback) and attach GSAP
      const obs = new MutationObserver((records)=>{
        for(const r of records){
          for(const n of r.addedNodes){
            if (!(n instanceof HTMLElement)) continue;
            const env = n.querySelector && n.querySelector('.envelope');
            if (env) attachAnimation(env);
          }
        }
      });
      obs.observe(document.body, {childList:true, subtree:true});

      // Also attach to any existing envelope nodes (in case modal already present)
      document.querySelectorAll('.envelope').forEach(attachAnimation);
    })();
    </script>
    <script src="script.js"></script>
